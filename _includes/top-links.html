{% if include.links %}
<div class="page__head_links">
  <p>
    {% if include.icon %}{% include icon.html name=include.icon %}{% endif %}
    {% for link in include.links %}
      {% if link != blank %}
        <a href="{{link | split: '|' | last}}">{{link | split: '|' | first}}</a>
      	{%- unless forloop.last %} · {% endunless %}
      {% endif %}
    {% endfor %}
  </p>
</div>
{% endif %}
